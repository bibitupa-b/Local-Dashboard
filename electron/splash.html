<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Local Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #15191a;
        --ink: #e9e7e0;
        --muted: #a6ada7;
        --accent: #9baf9e;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 18px;
        background: var(--bg);
        border-radius: 18px;
        border: 1px solid #394243;
        animation: stage-in 380ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .emblem {
        position: relative;
        width: 148px;
        height: 148px;
        margin: 0 auto;
        display: grid;
        place-items: center;
        animation: emblem-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .emblem img {
        width: 132px;
        height: 132px;
        border-radius: 26px;
        filter: drop-shadow(0 10px 28px rgba(189, 162, 122, 0.18));
      }
      .ring {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        border: 1px solid rgba(155, 175, 158, 0.35);
        animation: orbit 6s linear infinite;
      }
      .ring::after {
        content: "";
        position: absolute;
        top: -3px;
        left: 50%;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(155, 175, 158, 0.6);
      }
      .title {
        text-align: center;
        color: var(--ink);
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        animation: title-in 700ms 120ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .bar {
        width: 180px;
        height: 2px;
        margin: 0 auto;
        border-radius: 99px;
        background: #2b3334;
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        animation: sweep 1.4s ease-in-out infinite;
      }
      @keyframes stage-in {
        from {
          opacity: 0;
          transform: scale(0.985);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes emblem-in {
        from {
          opacity: 0;
          transform: scale(0.92);
          filter: blur(8px);
        }
        to {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
        }
      }
      @keyframes title-in {
        from {
          opacity: 0;
          letter-spacing: 0.34em;
          filter: blur(2px);
        }
        to {
          opacity: 1;
          letter-spacing: 0.24em;
          filter: blur(0);
        }
      }
      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes sweep {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
        }
        .bar span {
          width: 100%;
          background: var(--accent);
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="emblem">
        <span class="ring"></span>
        <img src="../assets/icon-transparent.png" alt="" />
      </div>
      <div class="title">Local Dashboard</div>
      <div class="bar"><span></span></div>
    </div>
  </body>
</html>
