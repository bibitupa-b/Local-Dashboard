<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Local Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --void: #05070d;
        --ink: #f4f6fb;
        --mist: #aeb6c8;
        --amber: #f5b36b;
        --edge: rgba(255, 255, 255, 0.13);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Onest", "Segoe UI", system-ui, sans-serif;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        border-radius: 22px;
        background:
          radial-gradient(420px 320px at 30% 18%, rgba(94, 106, 210, 0.35), transparent 68%),
          radial-gradient(320px 260px at 82% 30%, rgba(63, 191, 178, 0.2), transparent 70%),
          radial-gradient(280px 220px at 38% 72%, rgba(245, 179, 107, 0.16), transparent 72%),
          var(--void);
        border: 1px solid var(--edge);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.18);
        animation: card-in 380ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .emblem {
        width: 62px;
        height: 62px;
        border-radius: 18px;
        box-shadow: 0 12px 34px rgba(245, 179, 107, 0.2);
      }
      .title {
        font-family: "Unbounded", "Onest", sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: var(--ink);
      }
      .caption {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--mist);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 12px rgba(245, 179, 107, 0.7);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes card-in {
        from {
          opacity: 0;
          transform: scale(0.985);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="stage">
      <img class="emblem" src="../assets/icon-transparent.png" alt="" />
      <div class="title">Local Dashboard</div>
      <div class="caption"><span class="dot"></span>Reading your sources…</div>
    </div>
  </body>
</html>
