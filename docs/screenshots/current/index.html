<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Local Dashboard — current screens</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070d;
        --surface: #0f1522;
        --line: rgba(255, 255, 255, 0.13);
        --ink: #f4f6fb;
        --muted: #aeb6c8;
        --accent: #7ed9b0;
      }
      body {
        margin: 0;
        padding: 32px;
        background: var(--bg);
        color: var(--ink);
        font: 400 15px/1.6 "Segoe UI", system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        letter-spacing: -0.015em;
      }
      p.sub {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 20px;
      }
      figure {
        margin: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
      }
      figcaption {
        padding: 10px 14px;
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid var(--line);
      }
      figcaption b {
        color: var(--accent);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <h1>Local Dashboard — current screens</h1>
    <p class="sub">The Aurora Glass shell: a frameless window on a slow aurora, a source rail, the focus panel and the briefing. Dark only; a wallpaper can sit behind the glass.</p>
    <div class="grid">
      <figure>
        <img src="dashboard.jpeg" alt="Dashboard with the focus panel, source rail, today and the briefing" />
        <figcaption><b>Dashboard</b> — focus, today's calendar and the briefing inside the glass stage.</figcaption>
      </figure>
      <figure>
        <img src="welcome.jpeg" alt="First-run welcome dialog" />
        <figcaption><b>First run</b> — what stays local and what is sent to DeepSeek.</figcaption>
      </figure>
      <figure>
        <img src="search-suggestions.jpeg" alt="Search suggestions under the command field" />
        <figcaption><b>Search</b> — notes, mail and Drive suggestions in the command overlay.</figcaption>
      </figure>
      <figure>
        <img src="settings.jpeg" alt="Settings connections and preferences" />
        <figcaption><b>Settings</b> — connections with hints, application panel, preferences and the wallpaper picker.</figcaption>
      </figure>
      <figure>
        <img src="settings-preferences.jpeg" alt="Preferences with the wallpaper picker" />
        <figcaption><b>Preferences</b> — briefing settings and the nine app backgrounds; Aurora is the default.</figcaption>
      </figure>
    </div>
  </body>
</html>
