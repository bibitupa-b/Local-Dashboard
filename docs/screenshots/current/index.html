<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Local Dashboard — current screens</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #15191a;
        --surface: #202627;
        --line: #394243;
        --ink: #e9e7e0;
        --muted: #a6ada7;
        --accent: #9baf9e;
      }
      body {
        margin: 0;
        padding: 32px;
        background: var(--bg);
        color: var(--ink);
        font: 400 15px/1.6 "Segoe UI", system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        letter-spacing: -0.015em;
      }
      p.sub {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 20px;
      }
      figure {
        margin: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
      }
      figcaption {
        padding: 10px 14px;
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid var(--line);
      }
      figcaption b {
        color: var(--accent);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <h1>Local Dashboard — current screens</h1>
    <p class="sub">The one-page dashboard with the start line, services rail, today and the briefing. Dark only; the reading tick follows the line under the eye.</p>
    <div class="grid">
      <figure>
        <img src="dashboard.jpeg" alt="Dashboard with start line, services, today and briefing" />
        <figcaption><b>Dashboard</b> — start line, services rail, today's calendar and the briefing column.</figcaption>
      </figure>
      <figure>
        <img src="welcome.jpeg" alt="First-run welcome dialog" />
        <figcaption><b>First run</b> — what stays local and what is sent to DeepSeek.</figcaption>
      </figure>
      <figure>
        <img src="search-suggestions.jpeg" alt="Search suggestions" />
        <figcaption><b>Search</b> — notes, mail and Drive suggestions in a capped panel.</figcaption>
      </figure>
      <figure>
        <img src="settings.jpeg" alt="Settings connections and preferences" />
        <figcaption><b>Settings</b> — connections with hints, application panel and preferences.</figcaption>
      </figure>
    </div>
  </body>
</html>
